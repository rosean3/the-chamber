<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Script.js</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #05050f; color: white; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; border: 2px solid; border-radius: 8px; }
        .btn-primary { background: #00c8ff; color: white; border-color: #00c8ff; }
        .btn-secondary { background: #666; color: white; border-color: #666; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #log { background: #1a1a1a; padding: 15px; margin: 20px 0; border-radius: 8px; font-family: monospace; max-height: 400px; overflow-y: auto; border: 1px solid #333; }
        .error { color: #ff3232; }
        .success { color: #32ff96; }
        .warning { color: #ffaa00; }
        .info { color: #00c8ff; }
    </style>
</head>
<body>
    <h1>🧪 Teste Script.js - The Chamber</h1>
    
    <div>
        <button id="version-1-btn" class="btn btn-primary">🎯 VERSÃO 1</button>
        <button id="version-2-btn" class="btn btn-secondary">🎯 VERSÃO 2</button>
    </div>
    
    <div id="log"></div>
    
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span><br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        log('🚀 Página carregada', 'success');
        
        // Teste de carregamento do script.js
        document.addEventListener('DOMContentLoaded', () => {
            log('📱 DOM carregado', 'success');
            
            // Carrega o script.js
            log('📜 Carregando script.js...', 'info');
            
            const script = document.createElement('script');
            script.src = 'script.js';
            script.onload = () => {
                log('✅ script.js carregado com sucesso', 'success');
                
                // Testa se as funções estão disponíveis
                if (typeof selectVersion === 'function') {
                    log('✅ Função selectVersion disponível', 'success');
                } else {
                    log('❌ Função selectVersion NÃO disponível', 'error');
                }
                
                if (typeof showScreen === 'function') {
                    log('✅ Função showScreen disponível', 'success');
                } else {
                    log('❌ Função showScreen NÃO disponível', 'error');
                }
                
                // Configura os event listeners
                setupEventListeners();
            };
            
            script.onerror = () => {
                log('❌ Erro ao carregar script.js', 'error');
            };
            
            document.head.appendChild(script);
        });
        
        function setupEventListeners() {
            log('🔧 Configurando event listeners...', 'info');
            
            const version1Btn = document.getElementById('version-1-btn');
            const version2Btn = document.getElementById('version-2-btn');
            
            if (version1Btn) {
                version1Btn.addEventListener('click', () => {
                    log('🎯 VERSÃO 1 CLICADA!', 'success');
                    if (typeof selectVersion === 'function') {
                        log('   📊 Chamando selectVersion(1)...', 'info');
                        try {
                            selectVersion(1);
                            log('   ✅ selectVersion(1) executada com sucesso', 'success');
                        } catch (error) {
                            log(`   ❌ Erro ao executar selectVersion(1): ${error.message}`, 'error');
                        }
                    } else {
                        log('   ❌ Função selectVersion não disponível', 'error');
                    }
                });
                log('✅ Event listener V1 configurado', 'success');
            } else {
                log('❌ Botão V1 não encontrado', 'error');
            }
            
            if (version2Btn) {
                version2Btn.addEventListener('click', () => {
                    log('🎯 VERSÃO 2 CLICADA!', 'success');
                    if (typeof selectVersion === 'function') {
                        log('   📊 Chamando selectVersion(2)...', 'info');
                        try {
                            selectVersion(2);
                            log('   ✅ selectVersion(2) executada com sucesso', 'success');
                        } catch (error) {
                            log(`   ❌ Erro ao executar selectVersion(2): ${error.message}`, 'error');
                        }
                    } else {
                        log('   ❌ Função selectVersion não disponível', 'error');
                    }
                });
                log('✅ Event listener V2 configurado', 'success');
            } else {
                log('❌ Botão V2 não encontrado', 'error');
            }
            
            log('🎉 Configuração de event listeners concluída', 'success');
        }
        
        // Teste de erros
        window.addEventListener('error', (event) => {
            log(`❌ ERRO JavaScript: ${event.message}`, 'error');
            log(`   📍 Arquivo: ${event.filename}`, 'error');
            log(`   📍 Linha: ${event.lineno}`, 'error');
        });
    </script>
</body>
</html>
