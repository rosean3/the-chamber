<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Mínimo</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #05050f; color: white; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; border: 2px solid; border-radius: 8px; }
        .btn-primary { background: #00c8ff; color: white; border-color: #00c8ff; }
        .btn-secondary { background: #666; color: white; border-color: #666; }
        #log { background: #1a1a1a; padding: 15px; margin: 20px 0; border-radius: 8px; font-family: monospace; max-height: 400px; overflow-y: auto; border: 1px solid #333; }
        .error { color: #ff3232; }
        .success { color: #32ff96; }
        .info { color: #00c8ff; }
    </style>
</head>
<body>
    <h1>🧪 Teste Mínimo - Event Listeners</h1>
    
    <div>
        <button id="version-1-btn" class="btn btn-primary">🎯 VERSÃO 1</button>
        <button id="version-2-btn" class="btn btn-secondary">🎯 VERSÃO 2</button>
    </div>
    
    <div id="log"></div>
    
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span><br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        log('🚀 Página carregada', 'success');
        
        // Teste mínimo dos event listeners
        document.addEventListener('DOMContentLoaded', () => {
            log('📱 DOM carregado', 'success');
            
            const version1Btn = document.getElementById('version-1-btn');
            const version2Btn = document.getElementById('version-2-btn');
            
            if (version1Btn) {
                version1Btn.addEventListener('click', () => {
                    log('🎯 VERSÃO 1 CLICADA!', 'success');
                    log('   📊 Funcionando perfeitamente!', 'info');
                });
                log('✅ Event listener V1 configurado', 'success');
            } else {
                log('❌ Botão V1 não encontrado', 'error');
            }
            
            if (version2Btn) {
                version2Btn.addEventListener('click', () => {
                    log('🎯 VERSÃO 2 CLICADA!', 'success');
                    log('   📊 Funcionando perfeitamente!', 'info');
                });
                log('✅ Event listener V2 configurado', 'success');
            } else {
                log('❌ Botão V2 não encontrado', 'error');
            }
            
            log('🎉 Teste concluído com sucesso!', 'success');
        });
        
        // Teste de erros
        window.addEventListener('error', (event) => {
            log(`❌ ERRO JavaScript: ${event.message}`, 'error');
            log(`   📍 Arquivo: ${event.filename}`, 'error');
            log(`   📍 Linha: ${event.lineno}`, 'error');
        });
    </script>
</body>
</html>
